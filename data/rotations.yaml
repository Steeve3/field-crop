# Candidate 4-year rotations. The engine scores all of them and picks 3 alternatives to S0.
# years: crop ids from crops.yaml. cover: add a winter cover crop before a spring crop that year.
# irrigation: rainfed | deficit | full.  regions: north (Po Valley) | south (Mediterranean).
# ASSUMPTION: sequences chosen as common, agronomically sensible Italian rotations; review with an agronomist.

- id: maize_mono
  label: "Continuous maize"
  years: [maize, maize, maize, maize]
  cover: [false, false, false, false]
  irrigation: full
  regions: [north]

- id: maize_soy_wheat
  label: "Maize – soybean – maize – wheat"
  years: [maize, soybean, maize, soft_wheat]
  cover: [false, false, false, false]
  irrigation: full
  regions: [north]

- id: maize_soy_wheat_cover
  label: "Maize – wheat – soybean – wheat, with cover crops"
  years: [maize, soft_wheat, soybean, soft_wheat]
  cover: [true, false, true, false]
  irrigation: deficit
  regions: [north]

- id: sorghum_wheat_soy
  label: "Sorghum – wheat – soybean – barley (water saver)"
  years: [sorghum, soft_wheat, soybean, barley]
  cover: [true, false, false, false]
  irrigation: deficit
  regions: [north]

- id: alfalfa_maize
  label: "Alfalfa ×3 – maize"
  years: [alfalfa, alfalfa, alfalfa, maize]
  cover: [false, false, false, false]
  irrigation: deficit
  regions: [north]

- id: alfalfa_wheat
  label: "Alfalfa ×3 – wheat"
  years: [alfalfa, alfalfa, alfalfa, soft_wheat]
  cover: [false, false, false, false]
  irrigation: rainfed
  regions: [north, south]

- id: durum_mono
  label: "Continuous durum wheat"
  years: [durum_wheat, durum_wheat, durum_wheat, durum_wheat]
  cover: [false, false, false, false]
  irrigation: rainfed
  regions: [south]

- id: durum_chickpea
  label: "Durum – chickpea – durum – sunflower"
  years: [durum_wheat, chickpea, durum_wheat, sunflower]
  cover: [false, false, false, false]
  irrigation: rainfed
  regions: [south]

- id: durum_legume_barley
  label: "Durum – chickpea – barley – durum"
  years: [durum_wheat, chickpea, barley, durum_wheat]
  cover: [false, false, false, false]
  irrigation: rainfed
  regions: [south]

- id: durum_sorghum_cover
  label: "Durum – sorghum – durum – chickpea, with cover crop"
  years: [durum_wheat, sorghum, durum_wheat, chickpea]
  cover: [false, true, false, false]
  irrigation: rainfed
  regions: [south]

- id: alfalfa_durum
  label: "Alfalfa ×3 – durum wheat"
  years: [alfalfa, alfalfa, alfalfa, durum_wheat]
  cover: [false, false, false, false]
  irrigation: rainfed
  regions: [south]
