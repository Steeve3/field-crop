# Crop library. Every value is tagged.
#
# kc_by_month: crop coefficient per calendar month (index 0 = January), 0 = not in the field.
#   SOURCE: FAO-56 Table 12 (Allen et al. 1998) stage values, spread over typical
#   Italian sowing/harvest months. ASSUMPTION: monthly rounding of stage lengths.
# ky: yield response to water. SOURCE: FAO-33 (Doorenbos & Kassam 1979) unless marked.
# ym_t_ha: attainable yield with no water stress. ASSUMPTION: typical Italian values, check ISTAT.
# price_eur_t, cost_eur_ha: ASSUMPTION placeholders, check with ISMEA / local data.
# heat_months / frost_months: months when the crop is sensitive (flowering / establishment).
# heat_threshold_c: ASSUMPTION, common agronomic thresholds.
# legume: fixes nitrogen. deep_root: rooting > 1.5 m. Used by the soil score.

maize:
  name: "Maize (grain)"
  family: poaceae
  kc_by_month: [0, 0, 0, 0.30, 0.50, 1.00, 1.20, 1.20, 0.60, 0, 0, 0]
  ky: 1.25
  ym_t_ha: 12.0        # ASSUMPTION: irrigated Po Valley
  price_eur_t: 220     # ASSUMPTION
  cost_eur_ha: 1700    # ASSUMPTION (excl. irrigation)
  heat_months: [7]
  heat_threshold_c: 35
  frost_months: [4]
  legume: false
  deep_root: false

